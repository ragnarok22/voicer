[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "voicer"
version = "0.1.0"
description = "Generate OpenAI text-to-speech audio from a polished CLI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=2.37.0",
    "tiktoken>=0.13.0",
]

[project.scripts]
voicer = "main:cli"

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.0.3",
    "ruff>=0.15.0",
    "ty>=0.0.1",
]
