[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "voicer"
version = "0.1.0"
description = "Generate OpenAI text-to-speech audio from a polished CLI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.13.1,<3",
    "openai>=3.26.0,<4",
    "tiktoken>=0.14.0,<1",
]

[project.scripts]
voicer = "main:cli"

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["main"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7,<8",
    "ruff>=0.15.0",
    "ty>=0.0.1",
]
